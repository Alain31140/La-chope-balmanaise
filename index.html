<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QRFeedback</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="application">

    <!-- Carte principale -->
    <main class="card">

        <!-- Logo -->
        <img
            id="logo"
            src="images/logo.png"
            alt="Logo"
        >

        <!-- Nom du commerce -->
        <h1 id="commerceNom">
            Nom du commerce
        </h1>

        <!-- Slogan -->
        <p id="commerceSlogan">
            Merci de votre visite !
        </p>


        <!-- Zone du questionnaire -->
        <section id="questionnaire">

            <!-- Généré automatiquement par app.js -->

        </section>


        <!-- Commentaire -->

        <label for="commentaire">

            Votre commentaire

        </label>

        <textarea

            id="commentaire"

            placeholder="Dites-nous ce que vous avez pensé de votre visite..."

        ></textarea>



        <!-- Prénom -->

        <label for="prenom">

            Votre prénom (facultatif)

        </label>

        <input

            id="prenom"

            type="text"

            placeholder="Votre prénom"

        >



        <!-- Contact -->

        <label class="checkbox">

            <input
                id="contact"
                type="checkbox"
            >

            Je souhaite être recontacté.

        </label>



        <!-- Bouton -->

        <button id="btnEnvoyer">

            Envoyer mon avis

        </button>



        <!-- Message -->

<div id="message">

</div>



    </main>

</div>


<script src="app.js"></script>

</body>

</html>
